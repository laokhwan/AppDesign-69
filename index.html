/* Layout: brand bar + step rail on top; left = lesson card over code editor, right = live browser preview over automatic checks */
:root{
  --bg:#F3F7F5; --surface:#FFFFFF; --surface-2:#EEF3F1; --line:#D9E3DE;
  --ink:#1D1B33; --muted:#5E6472; --navy:#1800AD; --navy-soft:#ECEAFB;
  --green:#2FB57A; --green-ink:#197A50; --mint:#DDF4E8; --warn:#C2410C; --warn-soft:#FFF1E8;
  --code-bg:#FBFCFC; --cm-tag:#1800AD; --cm-attr:#197A50; --cm-str:#B4410F; --cm-com:#8A93A0; --cm-prop:#6B21A8;
  --font:"Prompt","Leelawadee UI","Tahoma",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,"Cascadia Code",Menlo,Consolas,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10111A; --surface:#181A26; --surface-2:#202334; --line:#2C3045;
  --ink:#ECECF6; --muted:#A3A8BA; --navy:#A79EFF; --navy-soft:#24224A;
  --green:#4ACB91; --green-ink:#6FDCAA; --mint:#183A2B; --warn:#FF9A62; --warn-soft:#3A2116;
  --code-bg:#141622; --cm-tag:#A79EFF; --cm-attr:#6FDCAA; --cm-str:#FFB07A; --cm-com:#6C7388; --cm-prop:#E1A6FF; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10111A; --surface:#181A26; --surface-2:#202334; --line:#2C3045;
  --ink:#ECECF6; --muted:#A3A8BA; --navy:#A79EFF; --navy-soft:#24224A;
  --green:#4ACB91; --green-ink:#6FDCAA; --mint:#183A2B; --warn:#FF9A62; --warn-soft:#3A2116;
  --code-bg:#141622; --cm-tag:#A79EFF; --cm-attr:#6FDCAA; --cm-str:#FFB07A; --cm-com:#6C7388; --cm-prop:#E1A6FF; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.6}
*{box-sizing:border-box}
button{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.app{display:flex;flex-direction:column;height:100%;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:10px;gap:10px}
/* top */
.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:36px;height:36px;border-radius:50%;background:var(--mint);display:grid;place-items:center;color:var(--green-ink);font-family:var(--mono);font-weight:600;font-size:13px;flex:none}
.brand h1{font-size:17px;margin:0;color:var(--navy);font-weight:600;line-height:1.2;text-wrap:balance}
.brand small{display:block;color:var(--muted);font-size:12px;font-weight:400}
.rail{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;height:32px;min-width:32px;padding:0 10px;cursor:pointer;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
.pill:hover{border-color:var(--green);color:var(--ink)}
.pill.done{background:var(--mint);border-color:transparent;color:var(--green-ink)}
.pill.cur{background:var(--navy);border-color:var(--navy);color:var(--surface)}
.pill .lbl{display:none}
.pill.cur .lbl{display:inline}
/* main grid */
.main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.col{display:flex;flex-direction:column;gap:10px;min-height:0;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.lesson{padding:14px 16px;overflow:auto;max-height:42%;flex:none}
.lesson .kicker{color:var(--green-ink);font-size:12px;font-weight:600;letter-spacing:.02em}
.lesson h2{margin:2px 0 4px;font-size:20px;color:var(--navy);line-height:1.3;text-wrap:balance}
.lesson .why{color:var(--muted);font-size:14px;margin:0 0 10px}
.lesson ol{margin:0 0 10px;padding-left:20px}
.lesson li{margin:3px 0}
.lesson code{font-family:var(--mono);font-size:.86em;background:var(--surface-2);padding:1px 5px;border-radius:5px;color:var(--cm-tag)}
.lesson pre{font-family:var(--mono);font-size:13px;background:var(--surface-2);padding:10px 12px;border-radius:8px;overflow-x:auto;margin:6px 0 10px;line-height:1.5}
.lesson pre code{background:none;padding:0;color:var(--ink)}
.w1{display:flex;gap:10px;align-items:flex-start;background:var(--navy-soft);border-radius:8px;padding:8px 12px;font-size:13.5px;margin:6px 0 10px}
.w1 b{color:var(--navy)}
details.hint{font-size:14px}
details.hint summary{cursor:pointer;color:var(--green-ink);font-weight:500}
.editor-card{flex:1;min-height:220px;display:flex;flex-direction:column;overflow:hidden}
.bar{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 14px;border-bottom:1px solid var(--line);font-size:13px;color:var(--muted);flex-wrap:wrap}
.bar .file{font-family:var(--mono);color:var(--ink);font-weight:600}
.bar .sp{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 12px;cursor:pointer;font-size:13px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--green);background:var(--surface-2)}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff}
.btn.primary:hover{filter:brightness(.95);background:var(--green)}
:root[data-theme="dark"] .btn.primary{color:#0B1A13}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#0B1A13}}
.btn.ghost{border-color:transparent;background:transparent}
.cmwrap{flex:1;min-height:0;position:relative}
.CodeMirror{height:100%;position:absolute;inset:0;font-family:var(--mono);font-size:14px;line-height:1.55;background:var(--code-bg);color:var(--ink)}
.CodeMirror-gutters{background:var(--code-bg);border-right:1px solid var(--line)}
.CodeMirror-linenumber{color:var(--cm-com)}
.CodeMirror-cursor{border-left:2px solid var(--green)}
.CodeMirror-selected,.CodeMirror-focused .CodeMirror-selected{background:var(--mint)!important}
.CodeMirror-matchingtag{background:var(--navy-soft)}
.cm-s-default .cm-tag{color:var(--cm-tag);font-weight:600}
.cm-s-default .cm-bracket{color:var(--cm-tag)}
.cm-s-default .cm-attribute{color:var(--cm-attr)}
.cm-s-default .cm-string{color:var(--cm-str)}
.cm-s-default .cm-comment{color:var(--cm-com);font-style:italic}
.cm-s-default .cm-property{color:var(--cm-prop)}
.cm-s-default .cm-qualifier,.cm-s-default .cm-builtin{color:var(--cm-tag)}
.cm-s-default .cm-keyword,.cm-s-default .cm-def{color:var(--cm-prop)}
.cm-s-default .cm-atom,.cm-s-default .cm-number,.cm-s-default .cm-variable-2{color:var(--cm-attr)}
.cm-s-default .cm-meta{color:var(--cm-com)}
.cm-s-default .cm-variable,.cm-s-default .cm-variable-3{color:var(--ink)}
.confirm{display:flex;gap:8px;align-items:center;padding:8px 14px;background:var(--warn-soft);font-size:13px;flex-wrap:wrap}
/* preview */
.preview{flex:1;min-height:240px;display:flex;flex-direction:column;overflow:hidden}
.chrome{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.dots{display:flex;gap:5px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line);display:block}
.addr{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px 12px;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--mono)}
.live{font-size:12px;color:var(--green-ink);display:flex;align-items:center;gap:6px}
.live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--green)}
iframe{flex:1;border:0;width:100%;background:#fff}
.err{background:var(--warn-soft);color:var(--warn);font-size:13px;padding:6px 12px;font-family:var(--mono)}
.checks{padding:12px 16px;flex:none;max-height:38%;overflow:auto}
.checks h3{margin:0 0 6px;font-size:15px;display:flex;align-items:center;gap:8px}
.score{font-size:12px;font-weight:500;color:var(--muted);background:var(--surface-2);border-radius:999px;padding:1px 10px}
.score.ok{background:var(--mint);color:var(--green-ink)}
.checks ul{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.checks li{display:flex;gap:8px;align-items:flex-start;font-size:14px}
.ico{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:12px;margin-top:2px;border:1.5px solid var(--line);color:transparent}
li.pass .ico{background:var(--green);border-color:var(--green);color:#fff}
li.pass{color:var(--ink)}
li.fail{color:var(--muted)}
.next{margin-top:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.celebrate{color:var(--green-ink);font-weight:500;font-size:14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:14px;z-index:20}
textarea.copyfb{width:100%;height:120px;font-family:var(--mono);font-size:12px;margin-top:8px}
@media (max-width:900px){
  .app{height:auto;min-height:100%}
  .main{grid-template-columns:1fr}
  .lesson,.checks{max-height:none}
  .editor-card{height:420px;flex:none}
  .preview{height:460px;flex:none}
  .rail{margin-left:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

/* ---------- helpers for checks ---------- */
function parseCSS(txt){
  txt = txt.replace(/\/\*[\s\S]*?\*\//g,'');
  const rules=[]; const re=/([^{}]+)\{([^{}]*)\}/g; let m;
  while((m=re.exec(txt))){
    const sels=m[1].trim().split(',').map(s=>s.trim().replace(/\s+/g,' ').toLowerCase());
    const decl={};
    m[2].split(';').forEach(d=>{const i=d.indexOf(':'); if(i>0){decl[d.slice(0,i).trim().toLowerCase()]=d.slice(i+1).trim();}});
    rules.push({sels,decl});
  }
  return rules;
}
function cssHas(ctx, selTest, prop){
  return ctx.rules.some(r => r.sels.some(s => typeof selTest==='string' ? s===selTest : selTest.test(s)) &&
    (Array.isArray(prop) ? prop.some(p=>p in r.decl) : (prop in r.decl)));
}
function txt(el){ return el ? el.textContent.trim() : ''; }
function make(code){
  const doc = new DOMParser().parseFromString(code,'text/html');
  const css = [...doc.querySelectorAll('style')].map(s=>s.textContent).join('\n');
  const js = [...doc.querySelectorAll('script')].map(s=>s.textContent).join('\n');
  return {code, doc, css, js, rules: parseCSS(css), q:(s)=>doc.querySelector(s), qa:(s)=>[...doc.querySelectorAll(s)]};
}

  <pre><code>&lt;a class="btn" href="mailto:me@example.com"&gt;ติดต่อฉัน&lt;/a&gt;

.btn {
  background-color: #2fb57a;
  color: white;
  padding: 10px 20px;
  border-radius: 8px;
  text-decoration: none;
  cursor: pointer;
}
.btn:hover { background-color: #1f8a5a; }</code></pre>`,
  hint:'ใน CSS ชื่อ class ต้องขึ้นต้นด้วยจุด <code>.btn</code> แต่ใน HTML เขียน <code>class="btn"</code> โดยไม่มีจุด',
  start:S6, sol:S7,
  checks:[
   ['มี element ที่ใช้ <code>class="btn"</code>', c=>!!c.q('.btn')],
   ['<code>.btn</code> มีสีพื้น (Signifier)', c=>cssHas(c,/\.btn$/,['background','background-color'])],
   ['<code>.btn</code> มี <code>padding</code> และ <code>border-radius</code>', c=>cssHas(c,/\.btn$/,['padding']) && cssHas(c,/\.btn$/,'border-radius')],
   ['มี <code>.btn:hover</code> ให้ปุ่มเปลี่ยนเมื่อชี้ (Feedback)', c=>c.rules.some(r=>r.sels.some(s=>/\.btn:hover$/.test(s)) && Object.keys(r.decl).length>0)],
  ]
 },
 {
  short:'JavaScript', title:'JavaScript: ปุ่มสลับโหมดมืด',
  why:'JavaScript ทำงานแบบ <b>เหตุการณ์ → ฟังก์ชัน → หน้าเว็บเปลี่ยน</b> เมื่อผู้ใช้คลิก ฟังก์ชันจะเพิ่มหรือลบ class <code>dark</code> ที่ <code>body</code> แล้ว CSS จะเปลี่ยนสีตาม',
  html:`<ol>
    <li>ใน <code>header</code> ใต้คำแนะนำตัว เพิ่มปุ่ม <code>&lt;button class="btn" onclick="toggleDark()"&gt;</code></li>
    <li>ก่อน <code>&lt;/body&gt;</code> เพิ่ม <code>&lt;script&gt;</code> ที่มีฟังก์ชัน <code>toggleDark()</code></li>
    <li>ใน <code>&lt;style&gt;</code> เขียนสีของโหมดมืดด้วย <code>body.dark</code> และเปลี่ยนสีหัวข้อที่มองไม่เห็นบนพื้นมืดด้วย <code>body.dark h1</code></li>
    <li>กดปุ่มในหน้าผลลัพธ์ให้หน้าเปลี่ยนสีจริง</li>
  </ol>
  <pre><code>&lt;script&gt;
  function toggleDark() {
    document.body.classList.toggle("dark");
  }
&lt;/script&gt;

body.dark {
  background-color: #1e1e2e;
  color: #f0f0f0;
}</code></pre>`,
  hint:'ชื่อใน <code>onclick="toggleDark()"</code> ต้องตรงกับชื่อฟังก์ชันทุกตัวอักษร ถ้ามีแถบสีส้มขึ้นเหนือหน้าผลลัพธ์ แปลว่า JavaScript มีข้อผิดพลาด อ่านเลขบรรทัดแล้วไปแก้',
  start:S7, sol:S8,
  checks:[
   ['มี <code>&lt;button&gt;</code> ที่เรียกฟังก์ชันเมื่อคลิก', c=>c.qa('button[onclick]').length>0 || /addEventListener\(\s*["']click/.test(c.js)],
   ['มี <code>&lt;script&gt;</code> ที่ประกาศ <code>function</code>', c=>/function\s+\w+\s*\(|=\s*\([^)]*\)\s*=>/.test(c.js)],
   ['ใช้ <code>classList.toggle</code> สลับ class', c=>/classList\.toggle\(/.test(c.js)],
   ['มีสไตล์ <code>body.dark</code> ใน CSS', c=>c.rules.some(r=>r.sels.some(s=>/(^|\s)(body)?\.dark(\s|$)/.test(s)))],
   ['ลองกดปุ่มแล้วหน้าเว็บเปลี่ยนจริง', c=>state.toggled || state.done.includes(7)],
  ]
 },
 {
  short:'ส่งงาน', title:'ส่งงานขึ้น GitHub Pages', final:true,
  why:'เว็บ CV ของคุณพร้อมแล้ว ขั้นสุดท้ายคือเอาขึ้นออนไลน์ให้ทุกคนเปิดดูได้ผ่านลิงก์',
  html:`<ol>
    <li>แก้ข้อมูลตัวอย่างให้เป็นของคุณเองให้ครบ แล้วกด <b>คัดลอกโค้ด</b></li>
    <li>เข้า <a href="https://github.com/new" target="_blank" rel="noopener">github.com/new</a> สร้าง repository ใหม่ ตั้งชื่อเช่น <code>cv</code> เลือก Public</li>
    <li>กด <b>Add file → Create new file</b> ตั้งชื่อไฟล์ <code>index.html</code> วางโค้ด แล้วกด <b>Commit changes</b></li>
    <li>ถ้ามีรูป กด <b>Add file → Upload files</b> อัปโหลดรูปชื่อ <code>me.jpg</code></li>
    <li>ไปที่ <b>Settings → Pages</b> เลือก Branch <code>main</code> แล้วกด <b>Save</b></li>
    <li>รอ 1–2 นาที แล้วเปิด <code>https://ชื่อผู้ใช้.github.io/cv/</code> ส่งลิงก์นี้ให้ผู้สอน</li>
  </ol>`,
  hint:'ไฟล์ต้องชื่อ <code>index.html</code> ตัวพิมพ์เล็กทั้งหมด ถ้าเปิดลิงก์แล้วขึ้น 404 ให้รออีกสักครู่ แล้วตรวจว่าเลือก branch <code>main</code> ใน Settings → Pages แล้ว',
  start:S8, sol:S8,
  checks:null
 }
];

/* ---------- state ---------- */
const KEY='w2-cv-lab-v1';
let state={step:0, code:S0, done:[], toggled:false};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null'); if(s&&typeof s.code==='string'){state=Object.assign(state,s); state.toggled=false;}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify({step:state.step,code:state.code,done:state.done}));}catch(e){}}

const $=id=>document.getElementById(id);
const PH='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120"><rect width="120" height="120" fill="#DDF4E8"/><circle cx="60" cy="46" r="20" fill="none" stroke="#2FB57A" stroke-width="5"/><path d="M24 104c4-20 18-30 36-30s32 10 36 30" fill="none" stroke="#2FB57A" stroke-width="5" stroke-linecap="round"/></svg>');

/* harness injected into the preview: reports JS errors and the dark toggle, and swaps missing images for a placeholder. Kept on one line so line numbers match the editor. */
const HARNESS='<script>(function(){var P='+JSON.stringify(PH)+';window.onerror=function(m,s,l){parent.postMessage({lab:1,err:m,line:l},"*")};document.addEventListener("error",function(e){var t=e.target;if(t&&t.tagName==="IMG"&&!t.dataset.ph){t.dataset.ph=1;t.src=P}},true);document.addEventListener("click",function(e){var a=e.target.closest&&e.target.closest("a[href]");if(a){e.preventDefault();parent.postMessage({lab:1,link:a.getAttribute("href")},"*")}});document.addEventListener("DOMContentLoaded",function(){var b=document.body,c=b.className;new MutationObserver(function(){if(b.className!==c){parent.postMessage({lab:1,toggled:1},"*")}}).observe(b,{attributes:true,attributeFilter:["class"]})})})();<\/script>';

function withHarness(code){
  const m=code.match(/<head[^>]*>/i);
  if(m){const i=m.index+m[0].length; return code.slice(0,i)+HARNESS+code.slice(i);}
  return HARNESS+code;
}

/* ---------- editor ---------- */
const cm=CodeMirror.fromTextArea($('code'),{
  mode:'htmlmixed', lineNumbers:true, lineWrapping:true, tabSize:2, indentUnit:2,
  autoCloseTags:true, autoCloseBrackets:true, matchTags:{bothTags:true},
  extraKeys:{Tab:cm=>cm.execCommand(cm.somethingSelected()?'indentMore':'insertSoftTab')}
});
cm.setValue(state.code);

let timer;
cm.on('change',()=>{clearTimeout(timer); timer=setTimeout(()=>{state.code=cm.getValue(); save(); render(); runChecks();},350);});

function render(){
  $('err').hidden=true;
  $('frame').srcdoc=withHarness(state.code);
}
window.addEventListener('message',e=>{
  const d=e.data; if(!d||!d.lab) return;
  if(d.err){ $('err').hidden=false; $('err').textContent='JavaScript ผิดพลาดที่บรรทัด '+d.line+': '+d.err; }
  if(d.toggled && !state.toggled){ state.toggled=true; runChecks(); }
  if(d.link){ toast('ลิงก์นี้จะพาไปที่ '+d.link+' เมื่อเว็บขึ้นออนไลน์'); }
});

/* ---------- UI ---------- */
function toast(msg){const t=$('toast'); t.textContent=msg; t.hidden=false; clearTimeout(t._h); t._h=setTimeout(()=>t.hidden=true,2600);}

function drawRail(){
  $('rail').innerHTML=steps.map((s,i)=>{
    const cls=['pill']; if(i===state.step) cls.push('cur'); else if(state.done.includes(i)) cls.push('done');
    const mark=state.done.includes(i)&&i!==state.step?'✓':(i+1);
    return `<button class="${cls.join(' ')}" data-i="${i}" type="button" aria-current="${i===state.step?'step':'false'}" title="ขั้นที่ ${i+1}: ${s.title}">${mark}<span class="lbl">${s.short}</span></button>`;
  }).join('');
}
$('rail').addEventListener('click',e=>{const b=e.target.closest('.pill'); if(b) go(+b.dataset.i);});

function drawLesson(){
  const s=steps[state.step];
  $('lesson').innerHTML=`<div class="kicker">ขั้นที่ ${state.step+1} จาก ${steps.length}</div>
    <h2>${s.title}</h2><p class="why">${s.why}</p>
    ${s.w1?`<div class="w1">${s.w1}</div>`:''}
    ${s.html}
    <details class="hint"><summary>คำใบ้</summary><p>${s.hint}</p></details>`;
  $('lesson').scrollTop=0;
  $('solBtn').hidden=!!s.final; $('resetBtn').hidden=!!s.final;
}

function runChecks(){
  const s=steps[state.step];
  if(s.final){ drawFinal(); return; }
  const c=make(state.code);
  const res=s.checks.map(([label,fn])=>{let ok=false; try{ok=!!fn(c);}catch(e){} return {label,ok};});
  const n=res.filter(r=>r.ok).length, all=n===res.length;
  if(all && !state.done.includes(state.step)){ state.done.push(state.step); save(); drawRail(); }
  $('checks').innerHTML=`<h3>ตรวจอัตโนมัติ <span class="score ${all?'ok':''}">${n}/${res.length}</span></h3>
    <ul>${res.map(r=>`<li class="${r.ok?'pass':'fail'}"><span class="ico" aria-hidden="true">✓</span><span><span class="sr">${r.ok?'ผ่าน: ':'ยังไม่ผ่าน: '}</span>${r.label}</span></li>`).join('')}</ul>
    <div class="next">${all?`<span class="celebrate">ผ่านครบทุกข้อ</span><button class="btn primary" id="nextBtn" type="button">ไปขั้นที่ ${state.step+2}: ${steps[state.step+1].short}</button>`:`<span style="color:var(--muted);font-size:13px">แก้โค้ดแล้วผลตรวจจะอัปเดตเอง</span>`}</div>`;
  const nb=$('nextBtn'); if(nb) nb.onclick=()=>go(state.step+1);
}

function drawFinal(){
  const c=make(state.code); const rows=[];
  steps.forEach((s,i)=>{ if(!s.checks) return; const ok=s.checks.every(([l,fn])=>{try{return !!fn(c);}catch(e){return false}}); rows.push({label:`ขั้นที่ ${i+1}: ${s.title}`,ok}); });
  const example=/สมใจ|somjai/.test(state.code);
  rows.push({label:'เปลี่ยนข้อมูลตัวอย่าง (สมใจ เรียนดี) เป็นของคุณเองแล้ว',ok:!example});
  const n=rows.filter(r=>r.ok).length;
  $('checks').innerHTML=`<h3>เช็กลิสต์ก่อนส่ง <span class="score ${n===rows.length?'ok':''}">${n}/${rows.length}</span></h3>
   <ul>${rows.map(r=>`<li class="${r.ok?'pass':'fail'}"><span class="ico" aria-hidden="true">✓</span><span>${r.label}</span></li>`).join('')}</ul>
   <div class="next"><button class="btn primary" id="copy2" type="button">คัดลอกโค้ด index.html</button></div>`;
  $('copy2').onclick=copyCode;
}

let pending=null;
function ask(msg,fn){ $('confirmMsg').textContent=msg; $('confirm').hidden=false; pending=fn; cm.refresh(); }
$('confirmYes').onclick=()=>{ $('confirm').hidden=true; if(pending) pending(); pending=null; cm.refresh(); };
$('confirmNo').onclick=()=>{ $('confirm').hidden=true; pending=null; cm.refresh(); };
$('resetBtn').onclick=()=>ask('แทนที่โค้ดทั้งหมดด้วยโค้ดเริ่มต้นของขั้นนี้?',()=>{cm.setValue(steps[state.step].start);});
$('solBtn').onclick=()=>ask('แทนที่โค้ดทั้งหมดด้วยเฉลยของขั้นนี้? ลองทำเองก่อนจะจำได้ดีกว่า',()=>{cm.setValue(steps[state.step].sol);});

function copyCode(){
  const code=cm.getValue();
  const fallback=()=>{ const ta=document.createElement('textarea'); ta.className='copyfb'; ta.value=code; ta.readOnly=true; $('checks').appendChild(ta); ta.focus(); ta.select(); toast('กด Ctrl+C (หรือ ⌘+C) เพื่อคัดลอก'); };
  try{ navigator.clipboard.writeText(code).then(()=>toast('คัดลอกโค้ดแล้ว นำไปวางในไฟล์ index.html'),fallback); }catch(e){ fallback(); }
}
$('copyBtn').onclick=copyCode;

function go(i){
  if(i<0||i>=steps.length) return;
  state.step=i; state.toggled=false; save();
  drawRail(); drawLesson(); runChecks(); render();
  if(window.innerWidth<=900) $('lesson').scrollIntoView({behavior:'smooth',block:'start'});
}

drawRail(); drawLesson(); render(); runChecks();
})();
</script>
